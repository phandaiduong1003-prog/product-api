name: Product API CI Production Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-product-api:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check server.js
          node --check routes/productRoutes.js
          node --check models/Product.js

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          sleep 5

      - name: Health check
        run: |
          curl --fail http://localhost:3000/health

      - name: Test CREATE Product
        run: |
          curl --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"pid":101,"pname":"CI Product","price":100000,"quantity":10}' \
            http://localhost:3000/api/products

      - name: Test READ Product
        run: |
          curl --fail http://localhost:3000/api/products/101

      - name: Test UPDATE Product
        run: |
          curl --fail \
            -X PUT \
            -H "Content-Type: application/json" \
            -d '{"pname":"CI Product Updated","price":120000,"quantity":20}' \
            http://localhost:3000/api/products/101

      - name: Test DELETE Product
        run: |
          curl --fail \
            -X DELETE \
            http://localhost:3000/api/products/101

      - name: Show server log
        if: always()
        run: cat server.log